# Railway backend service — set Root Directory to `backend`.
# Uses Nixpacks (see backend/railway.json). Prisma migrate runs on start.
#
# LibreOffice: branded DOCX → PDF (IE, PT, ES, CZ, RO).
# Playwright: HTML PDF fallback when no DOCX pack (e.g. Brazil).
# postinstall syncs Templates → assets/docx-templates and Alex Brush font.

[phases.setup]
nixPkgs = ["nodejs_22", "pnpm"]
aptPkgs = [
  "libreoffice",
  "libreoffice-writer",
  "fontconfig",
  "fonts-liberation",
  "libnss3",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxfixes3",
  "libxrandr2",
  "libgbm1",
  # Ubuntu Noble (24.04) renamed libasound2 → libasound2t64 (t64 ABI transition).
  # The Railway/nixpacks base image is now Noble, so the old name has no install
  # candidate and the build fails. See: time_t 64-bit transition.
  "libasound2t64",
  "libpango-1.0-0",
  "libcairo2",
]

[phases.install]
cmds = [
  # Railway builds this service with Root Directory = backend, so the root
  # workspace lockfile isn't in the build context. A committed, standalone
  # backend/pnpm-lock.yaml (generated with --ignore-workspace, kept in sync
  # with backend/package.json) makes the install reproducible:
  # --frozen-lockfile fails the build on drift instead of silently resolving
  # new caret-range versions into production.
  "pnpm install --frozen-lockfile --ignore-workspace",
  "npx playwright install chromium",
]

[phases.build]
cmds = ["pnpm run build"]
