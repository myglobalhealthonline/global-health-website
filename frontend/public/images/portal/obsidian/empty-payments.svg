<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" fill="none" role="presentation">
  <defs>
    <filter id="ep-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#07120C" flood-opacity="0.14"/>
    </filter>
    <filter id="ep-soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#07120C" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="ep-ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F8F0"/>
    </linearGradient>
    <linearGradient id="ep-forest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#226044"/>
      <stop offset="0.55" stop-color="#1D4B36"/>
      <stop offset="1" stop-color="#16382A"/>
    </linearGradient>
  </defs>
  <!-- blank receipt -->
  <g filter="url(#ep-soft)">
    <path d="M336 168 h240 a16 16 0 0 1 16 16 v276 l-24 -14 -24 14 -24 -14 -24 14 -24 -14 -24 14 -24 -14 -24 14 -24 -14 -24 14 V184 a16 16 0 0 1 16 -16 Z"
      fill="url(#ep-ivory)" stroke="#1D4B36" stroke-opacity="0.7" stroke-width="1.5"/>
  </g>
  <!-- faint tone bands -->
  <g fill="#1D4B36">
    <rect x="364" y="208" width="128" height="10" rx="5" fill-opacity="0.12"/>
    <rect x="364" y="244" width="184" height="8" rx="4" fill-opacity="0.08"/>
    <rect x="364" y="266" width="184" height="8" rx="4" fill-opacity="0.08"/>
    <rect x="364" y="288" width="132" height="8" rx="4" fill-opacity="0.08"/>
    <rect x="364" y="326" width="184" height="8" rx="4" fill-opacity="0.06"/>
    <rect x="364" y="348" width="152" height="8" rx="4" fill-opacity="0.06"/>
    <rect x="364" y="392" width="100" height="10" rx="5" fill-opacity="0.12"/>
  </g>
  <!-- abstract coin with lime rim light -->
  <g filter="url(#ep-soft2)">
    <circle cx="652" cy="392" r="66" fill="url(#ep-forest)"/>
    <path d="M652 326 a66 66 0 0 1 57 33" stroke="#B0F122" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="652" cy="392" r="44" fill="none" stroke="#FAFBF7" stroke-opacity="0.28" stroke-width="1.5"/>
  </g>
</svg>
