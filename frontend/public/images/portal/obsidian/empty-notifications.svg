<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" fill="none" role="presentation">
  <defs>
    <filter id="en-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#07120C" flood-opacity="0.14"/>
    </filter>
    <filter id="en-soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#07120C" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="en-ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F8F0"/>
    </linearGradient>
    <linearGradient id="en-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#EFF2EA" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <!-- glass tray beneath -->
  <g filter="url(#en-soft2)">
    <ellipse cx="480" cy="452" rx="180" ry="26" fill="url(#en-glass)" stroke="#1D4B36" stroke-opacity="0.25" stroke-width="1.25"/>
  </g>
  <!-- soft bell-like shape -->
  <g filter="url(#en-soft)">
    <path d="M480 188 c-64 0 -104 48 -104 116 v52 c0 22 -12 34 -28 46 h264 c-16 -12 -28 -24 -28 -46 v-52 c0 -68 -40 -116 -104 -116 Z"
      fill="url(#en-ivory)" stroke="#1D4B36" stroke-opacity="0.75" stroke-width="1.5"/>
    <path d="M452 428 a28 20 0 0 0 56 0" fill="url(#en-ivory)" stroke="#1D4B36" stroke-opacity="0.6" stroke-width="1.5"/>
  </g>
  <!-- resting lime signal dot -->
  <g filter="url(#en-soft2)">
    <circle cx="626" cy="252" r="14" fill="#B0F122"/>
    <circle cx="626" cy="252" r="20" fill="none" stroke="#B0F122" stroke-opacity="0.35" stroke-width="2"/>
  </g>
</svg>
