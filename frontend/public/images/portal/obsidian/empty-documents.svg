<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" fill="none" role="presentation">
  <defs>
    <filter id="ed-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#07120C" flood-opacity="0.14"/>
    </filter>
    <filter id="ed-soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#07120C" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="ed-ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F8F0"/>
    </linearGradient>
    <linearGradient id="ed-ivory2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFDF9"/>
      <stop offset="1" stop-color="#EFF2EA"/>
    </linearGradient>
    <linearGradient id="ed-lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B0F122" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#B0F122"/>
      <stop offset="1" stop-color="#B0F122" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- back sheet, fanned left -->
  <g filter="url(#ed-soft2)" transform="rotate(-7 480 340)">
    <rect x="336" y="188" width="256" height="316" rx="16" fill="url(#ed-ivory2)" stroke="#1D4B36" stroke-opacity="0.45" stroke-width="1.25"/>
  </g>
  <!-- middle sheet, fanned right -->
  <g filter="url(#ed-soft2)" transform="rotate(5 500 340)">
    <rect x="360" y="176" width="256" height="316" rx="16" fill="url(#ed-ivory2)" stroke="#1D4B36" stroke-opacity="0.55" stroke-width="1.25"/>
  </g>
  <!-- top sheet -->
  <g filter="url(#ed-soft)">
    <rect x="352" y="160" width="256" height="316" rx="16" fill="url(#ed-ivory)" stroke="#1D4B36" stroke-opacity="0.8" stroke-width="1.5"/>
  </g>
  <!-- lime highlight along top sheet edge -->
  <path d="M368 161 h224" stroke="url(#ed-lime)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- faint tone bands suggesting paragraphs -->
  <g fill="#1D4B36">
    <rect x="384" y="204" width="150" height="10" rx="5" fill-opacity="0.12"/>
    <rect x="384" y="236" width="192" height="8" rx="4" fill-opacity="0.08"/>
    <rect x="384" y="258" width="192" height="8" rx="4" fill-opacity="0.08"/>
    <rect x="384" y="280" width="140" height="8" rx="4" fill-opacity="0.08"/>
    <rect x="384" y="318" width="192" height="8" rx="4" fill-opacity="0.06"/>
    <rect x="384" y="340" width="168" height="8" rx="4" fill-opacity="0.06"/>
    <rect x="384" y="362" width="184" height="8" rx="4" fill-opacity="0.06"/>
    <rect x="384" y="400" width="104" height="8" rx="4" fill-opacity="0.06"/>
  </g>
</svg>
