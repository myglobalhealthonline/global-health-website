<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" fill="none" role="presentation">
  <defs>
    <filter id="cl-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#07120C" flood-opacity="0.14"/>
    </filter>
    <filter id="cl-soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#07120C" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="cl-ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F8F0"/>
    </linearGradient>
    <radialGradient id="cl-lime" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#CFEC81"/>
      <stop offset="1" stop-color="#B0F122"/>
    </radialGradient>
  </defs>
  <!-- orbital curve passing behind the grid -->
  <path d="M204 448 C 320 220, 640 200, 772 344" stroke="#1D4B36" stroke-opacity="0.5" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- month panel -->
  <g filter="url(#cl-soft)">
    <rect x="288" y="180" width="384" height="300" rx="22" fill="url(#cl-ivory)" stroke="#1D4B36" stroke-opacity="0.75" stroke-width="1.5"/>
  </g>
  <!-- blank month tiles -->
  <g stroke="#1D4B36" stroke-opacity="0.4" stroke-width="1.25" fill="none">
    <rect x="316" y="216" width="72" height="56" rx="10"/>
    <rect x="400" y="216" width="72" height="56" rx="10"/>
    <rect x="484" y="216" width="72" height="56" rx="10"/>
    <rect x="568" y="216" width="72" height="56" rx="10"/>
    <rect x="316" y="288" width="72" height="56" rx="10"/>
    <rect x="484" y="288" width="72" height="56" rx="10"/>
    <rect x="568" y="288" width="72" height="56" rx="10"/>
    <rect x="316" y="360" width="72" height="56" rx="10"/>
    <rect x="400" y="360" width="72" height="56" rx="10"/>
    <rect x="484" y="360" width="72" height="56" rx="10"/>
    <rect x="568" y="360" width="72" height="56" rx="10"/>
  </g>
  <!-- one raised lime tile -->
  <g filter="url(#cl-soft2)">
    <rect x="396" y="280" width="80" height="64" rx="10" fill="url(#cl-lime)"/>
    <rect x="396" y="280" width="80" height="64" rx="10" fill="none" stroke="#8FB021" stroke-opacity="0.7" stroke-width="1.25"/>
  </g>
</svg>
