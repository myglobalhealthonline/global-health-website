<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" fill="none" role="presentation">
  <defs>
    <filter id="ec-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#07120C" flood-opacity="0.14"/>
    </filter>
    <filter id="ec-soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#07120C" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="ec-ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F8F0"/>
    </linearGradient>
    <linearGradient id="ec-forest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#226044"/>
      <stop offset="0.55" stop-color="#1D4B36"/>
      <stop offset="1" stop-color="#16382A"/>
    </linearGradient>
    <linearGradient id="ec-lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B0F122"/>
      <stop offset="1" stop-color="#B0F122" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- forest card peeking from behind with lime edge light -->
  <g filter="url(#ec-soft2)">
    <rect x="512" y="232" width="204" height="256" rx="16" fill="url(#ec-forest)"/>
    <rect x="713" y="240" width="2.5" height="120" rx="1.25" fill="url(#ec-lime)"/>
  </g>
  <!-- blank editorial card -->
  <g filter="url(#ec-soft)">
    <rect x="264" y="176" width="336" height="312" rx="18" fill="url(#ec-ivory)" stroke="#1D4B36" stroke-opacity="0.75" stroke-width="1.5"/>
  </g>
  <!-- image placeholder rectangle -->
  <rect x="292" y="204" width="280" height="150" rx="12" fill="#1D4B36" fill-opacity="0.07" stroke="#1D4B36" stroke-opacity="0.25" stroke-width="1.25"/>
  <!-- blank tone bands beneath -->
  <rect x="292" y="382" width="216" height="12" rx="6" fill="#1D4B36" fill-opacity="0.12"/>
  <rect x="292" y="410" width="280" height="9" rx="4.5" fill="#1D4B36" fill-opacity="0.08"/>
  <rect x="292" y="432" width="240" height="9" rx="4.5" fill="#1D4B36" fill-opacity="0.08"/>
</svg>
