# Frontend service — Root Directory must be `frontend`.
#
# A Dockerfile in this folder is the source of truth for build + start so the
# runtime image always contains `.next/` (Railpack alone can run `next start`
# without shipping the production build).
#
# Pin the Dockerfile so both Git-connected and Railway CLI deploys use the
# production standalone image rather than falling back to Railpack.
[build]
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 100
