name: Load test smoke (k6)

# Manual-dispatch only for now — this needs LOADTEST_FRONTEND_URL,
# LOADTEST_BACKEND_URL, and LOADTEST_PROXY_CLIENT_IP_SECRET configured as
# repository secrets pointing at a non-production target first (see
# docs/testing/load-test-run-sheet.md). Once that's done, add a `schedule:`
# trigger here (mirroring the seo-live-urls cron in ci.yml) so this becomes
# an actual regression gate instead of something that has to be remembered.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "k6 profile to run"
        required: false
        default: "smoke"
        type: choice
        options:
          - smoke
          - baseline

permissions:
  contents: read

jobs:
  k6-smoke:
    name: k6 ${{ inputs.profile }} against staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install k6
        run: |
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 profile
        working-directory: loadtest
        env:
          LOADTEST_FRONTEND_URL: ${{ secrets.LOADTEST_FRONTEND_URL }}
          LOADTEST_BACKEND_URL: ${{ secrets.LOADTEST_BACKEND_URL }}
          PROXY_CLIENT_IP_SECRET: ${{ secrets.LOADTEST_PROXY_CLIENT_IP_SECRET }}
        run: ./run.sh "${{ inputs.profile }}"

      - name: Upload k6 results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-${{ inputs.profile }}-results
          path: docs/audits/perf/loadtest-*/
          if-no-files-found: warn
