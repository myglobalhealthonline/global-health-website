name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # `seo-live-urls` probes deployed production, so it also needs to run on a
  # clock (production can rot with no commit behind it — a doctor row going
  # inactive breaks a redirect target without anyone touching this repo) and
  # on demand after a deploy.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege by default; jobs that need more (e.g. gitleaks PR comments)
# scope it themselves at the job level.
permissions:
  contents: read

jobs:
  # ── Typecheck + Lint ─────────────────────────────────────────────────────
  # Fast gate: no DB required. Fails early on type errors or lint warnings
  # before the heavier test jobs start.
  check:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: "10.33.2"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (frontend + backend)
        run: pnpm typecheck

      - name: Lint (frontend + backend)
        run: pnpm lint

      - name: Build (frontend + backend)
        # Catches breakage typecheck alone misses (e.g. an invalid Next.js
        # page export that only fails Next's production build/analyzer, not
        # plain `tsc --noEmit`). Mirrors what Railway actually builds.
        run: pnpm build

      - name: Check pnpm.overrides drift (root vs frontend vs backend)
        # Children deploy standalone (--ignore-workspace) and do NOT inherit the
        # root overrides, so a security pin must be mirrored into every service
        # that resolves the package. See docs/guides/dependency-overrides.md.
        run: node scripts/check-override-drift.mjs

      - name: Check membership-card CSS copy is in sync
        # The card is authored once in frontend/app/portal.css; the backend
        # renders the downloadable/emailed PNG from a generated copy, because
        # the two services deploy standalone.
        run: node scripts/build-member-card-css.mjs --check

      - name: Audit dependencies (workspace)
        # S-028 (2026-08-02): the npm audit endpoints this once needed
        # --ignore-registry-errors to route around (they returned 410) are
        # responding again as of this date — verified locally, this step ran
        # clean without the flag. Kept as a defensive no-op in case of a
        # future registry outage; do not rely on this alone. OSV-Scanner
        # (below) is the authoritative SCA gate — it reads the lockfiles
        # directly against the OSV database and doesn't depend on npm's
        # registry endpoints at all.
        run: pnpm audit --audit-level=high --ignore-registry-errors

  # ── Secret scan ──────────────────────────────────────────────────────────
  # Gitleaks scans every push/PR diff for hardcoded secrets (API keys,
  # tokens, credentials). Free for personal-account-owned repos (this repo
  # is owned by the myglobalhealthonline GitHub user, not an org), so no
  # GITLEAKS_LICENSE secret is required — the env var below is a no-op
  # reference kept for forward-compat if the repo ever moves under an org.
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── Backend Tests ─────────────────────────────────────────────────────────
  # Spins up a real Postgres instance so all 14 backend tests run —
  # including the two integration tests (auth audit hook, doctor-services)
  # that self-skip when no DB is reachable.
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gh_test
      # Zod schema requires >= 16 chars for CRON_SECRET.
      CRON_SECRET: ci-cron-placeholder-min-16
      NODE_ENV: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: "10.33.2"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Run backend tests
        run: pnpm --filter backend test

  # ── Frontend Tests ────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: "10.33.2"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm --filter frontend test

  # ── SEO live-URL assertions ─────────────────────────────────────────────────
  # §4 of docs/plans/seo-implementation-brief-2026-08-14.md. Asserts against
  # DEPLOYED PRODUCTION that no redirect terminates in a 404, that every sitemap
  # entry is a live indexable 200, and that every GONE_DOCTORS URL answers 410.
  #
  # Deliberately NOT part of `test-frontend`, and deliberately not on pull_request:
  # the failures it catches are data-shaped, not code-shaped. A doctor row going
  # inactive breaks a redirect target with no commit behind it, so a PR gate would
  # block unrelated work on a defect the PR did not cause and cannot fix. It runs
  # on merge to main (verifies what just shipped), weekly (catches data rot), and
  # on demand (verify a deploy). The offline half — GONE_DOCTORS metadata and the
  # gone-slug rule check — lives in the same file and DOES run on every PR via
  # test-frontend, because that half is code-shaped.
  #
  # This is the gate that would have caught SEO-DOC-004: three Czech redirects
  # 308ing into a 404 for long enough to reach the ledger as "CLOSED — VERIFIED
  # BY PRODUCTION CHECK".
  seo-live-urls:
    name: SEO live URL assertions (production)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    # A red check on a scheduled run surfaces nothing. The defect this gate
    # exists to catch survived precisely because "the team catches these when
    # something surfaces them, and nothing surfaces them" — a cron that fails
    # into a CI log nobody opens reproduces that gap exactly. So a failure
    # opens/updates a GitHub issue, which is the one channel that needs no
    # secret. TODO: mirror to the channel the team actually reads (the same one
    # the WhatsApp ops reports go to) — that is one repository secret plus a
    # curl step, not a code change.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: "10.33.2"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Probe production URLs
        id: probe
        env:
          SEO_CHECK_BASE: https://www.myglobalhealth.online
        run: pnpm --filter frontend test tests/unit/seo-live-urls.test.ts 2>&1 | tee probe.log

      - name: Surface the failure where a human will see it
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('probe.log')
              ? fs.readFileSync('probe.log', 'utf8').slice(-6000)
              : '(no probe.log captured)';
            const title = 'SEO live URL check is failing against production';
            const body = [
              `The scheduled \`seo-live-urls\` check failed on ${context.sha.slice(0, 8)}.`,
              '',
              'This gate probes **deployed production**, so a failure here usually means',
              'one of: a redirect now terminates in a 404, a sitemap entry is dead or',
              '`noindex`, or a `GONE_DOCTORS` URL stopped answering 410. It can fire with',
              'no commit behind it — a doctor row going inactive breaks a redirect target',
              'from the database.',
              '',
              `[Full run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '```',
              log,
              '```',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'seo-live-urls',
            });
            if (open.length) {
              // Comment rather than pile up duplicates every Monday.
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['seo-live-urls'],
              });
            }

  # ── E2E (Playwright, role-authenticated) ────────────────────────────────────
  # S-028 (2026-08-02 audit): docs/audits/security/audit-authz-matrix-2026-08-02.md.
  # E2E was not wired into CI at all before this. Boots a real Postgres +
  # backend + frontend (Next dev — matches the "reuse existing/dev locally"
  # path in playwright.config.ts's webServer; CI's own prod-build path there
  # only starts the frontend, not the backend this job also needs), seeds
  # all 6 roles via backend/scripts/seed-test-accounts.ts, then runs
  # auth.setup.ts (produces one storageState per role) and
  # authz-boundaries.spec.ts (cross-portal boundary checks) via `pnpm e2e`.
  #
  # continue-on-error stays true — unlike every other gate in this file, this
  # one could NOT be dry-run locally (no way to also stand up a live frontend
  # dev server in this session) — TODO: flip to false once a clean run is
  # confirmed in Actions.
  e2e-authz:
    name: E2E (Playwright, authorization boundaries)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gh_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gh_e2e
      NODE_ENV: test
      CRON_SECRET: ci-cron-placeholder-min-16
      PORT: "4000"
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000
      # Each pair (SEED_* / E2E_*_PASSWORD) must carry the SAME value: the
      # seed script consumes SEED_*_PASSWORD to create the account; Playwright's
      # auth.setup.ts consumes E2E_*_PASSWORD to log in as that same account.
      SEED_DOCTOR_PASSWORD: ${{ secrets.E2E_SEED_PASSWORD_1 || 'ci-e2e-doctor-pw-1!' }}
      SEED_PATIENT_PASSWORD: ${{ secrets.E2E_SEED_PASSWORD_2 || 'ci-e2e-patient-pw-2!' }}
      SEED_SUPER_ADMIN_PASSWORD: ${{ secrets.E2E_SEED_PASSWORD_3 || 'ci-e2e-superadmin-pw-3!' }}
      SEED_ADMIN_PASSWORD: ${{ secrets.E2E_SEED_PASSWORD_4 || 'ci-e2e-admin-pw-4!' }}
      SEED_LOCAL_ADMIN_PASSWORD: ${{ secrets.E2E_SEED_PASSWORD_5 || 'ci-e2e-localadmin-pw-5!' }}
      SEED_CORPORATE_ADMIN_PASSWORD: ${{ secrets.E2E_SEED_PASSWORD_6 || 'ci-e2e-corpadmin-pw-6!' }}
      SEED_DOCTOR2_PASSWORD: ${{ secrets.E2E_SEED_PASSWORD_7 || 'ci-e2e-doctor2-pw-7!' }}
      SEED_PATIENT2_PASSWORD: ${{ secrets.E2E_SEED_PASSWORD_8 || 'ci-e2e-patient2-pw-8!' }}
      E2E_TEST_EMAIL: patient@globalhealthonline.com
      E2E_TEST_PASSWORD: ${{ secrets.E2E_SEED_PASSWORD_2 || 'ci-e2e-patient-pw-2!' }}
      E2E_DOCTOR_EMAIL: doctor@globalhealthonline.com
      E2E_DOCTOR_PASSWORD: ${{ secrets.E2E_SEED_PASSWORD_1 || 'ci-e2e-doctor-pw-1!' }}
      E2E_ADMIN_EMAIL: admin@globalhealthonline.com
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_SEED_PASSWORD_4 || 'ci-e2e-admin-pw-4!' }}
      E2E_SUPER_ADMIN_EMAIL: superadmin@globalhealthonline.com
      E2E_SUPER_ADMIN_PASSWORD: ${{ secrets.E2E_SEED_PASSWORD_3 || 'ci-e2e-superadmin-pw-3!' }}
      E2E_LOCAL_ADMIN_EMAIL: localadmin@globalhealthonline.com
      E2E_LOCAL_ADMIN_PASSWORD: ${{ secrets.E2E_SEED_PASSWORD_5 || 'ci-e2e-localadmin-pw-5!' }}
      E2E_CORPORATE_ADMIN_EMAIL: corporateadmin@globalhealthonline.com
      E2E_CORPORATE_ADMIN_PASSWORD: ${{ secrets.E2E_SEED_PASSWORD_6 || 'ci-e2e-corpadmin-pw-6!' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Generate an ephemeral RS256 keypair for this run
        # backend/src/utils/auth-session.ts requires both keys at module load
        # (S-012 RS256-only, no symmetric fallback), so the backend could not
        # boot and this job failed at "Start backend" on every run. The pair is
        # minted fresh per run, lives only in this runner, is never committed,
        # and is unrelated to the production keypair held in Railway. Format
        # matches what env.ts documents: PKCS8 private, SPKI public.
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out jwt-priv.pem
          openssl rsa -pubout -in jwt-priv.pem -out jwt-pub.pem
          {
            echo "AUTH_JWT_PRIVATE_KEY<<GH_PEM_EOF"
            cat jwt-priv.pem
            echo "GH_PEM_EOF"
            echo "AUTH_JWT_PUBLIC_KEY<<GH_PEM_EOF"
            cat jwt-pub.pem
            echo "GH_PEM_EOF"
          } >> "$GITHUB_ENV"
          rm -f jwt-priv.pem jwt-pub.pem

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: "10.33.2"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm e2e:install

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Seed all 6 roles + cross-tenant fixtures
        # SEED_*_PASSWORD vars are already set at job level and inherited here.
        run: pnpm --filter backend exec node --import tsx scripts/seed-test-accounts.ts

      - name: Start backend
        run: |
          pnpm --filter backend build
          nohup node backend/dist/server.js > backend-ci.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/ready > /dev/null; then
              echo "backend ready"; exit 0
            fi
            sleep 1
          done
          echo "backend did not become ready in time"; cat backend-ci.log; exit 1

      - name: Run E2E (auth setup + authorization boundaries)
        continue-on-error: true # TODO: flip to false once a clean run is confirmed in Actions
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  # ── Dependency review (PR-only) ───────────────────────────────────────────
  # Diffs the dependency graph on a PR and fails on newly introduced
  # high-severity vulns or disallowed licenses. No-op outside pull_request.
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        # This action needs the repository's Dependency graph, which is off for
        # this private repo — it answers "Dependency review is not supported on
        # this repository" and can never pass on merit. Kept rather than deleted
        # so the gate returns the moment the setting is flipped (Settings >
        # Security & analysis > Dependency graph). The `sca-osv` job covers the
        # same ground meanwhile, reading the lockfiles directly.
        # TODO: flip to false once Dependency graph is enabled.
        continue-on-error: true
        with:
          fail-on-severity: high

  # ── SCA (OSV-Scanner) ──────────────────────────────────────────────────────
  # S-028 (2026-08-02 audit): a lockfile-native scanner reading pnpm-lock.yaml
  # directly against the OSV database, independent of npm's registry
  # endpoints entirely (unlike the `pnpm audit` steps above). Recursive scan
  # from repo root in one pass covers all three lockfiles that matter —
  # root, frontend/, and backend/ — since the two child services deploy
  # standalone (--ignore-workspace) and do NOT inherit root pnpm.overrides.
  # This job calls Google's official reusable workflow (job-level `uses:`,
  # not a step sequence — a reusable-workflow call cannot be expressed as a
  # regular pinned-action step) rather than the raw scanner action, matching
  # upstream's own guidance that the scanner action is not meant to be used
  # directly. upload-sarif is disabled: it targets GitHub Code Scanning,
  # which needs GitHub Advanced Security on this private repo — the same
  # open licensing question flagged for codeql.yml in
  # docs/audits/security/tooling-images-2026-08-02.md. Re-enable once that
  # is confirmed, so results also land in the Security tab.
  sca-osv:
    name: SCA (OSV-Scanner)
    # A reusable workflow cannot request more permission than its caller grants.
    # osv-scanner-reusable.yml declares `actions: read` + `security-events: write`,
    # so without this block the whole CI run is rejected at startup
    # ("startup_failure") and NO job in this file runs at all. These stay even
    # though upload-sarif is false below: the permission check is static, done
    # before any input is evaluated.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        -r
        ./
      upload-sarif: false

  # ── SAST (Semgrep) ─────────────────────────────────────────────────────────
  # S-028 (2026-08-02 audit): registry rulesets (typescript, nodejs,
  # owasp-top-ten, secrets, javascript) against backend/src + frontend.
  # Plain pip install + CLI invocation (not a third-party action) — this
  # matches how every other gate in this file runs (plain `run:` steps) and
  # avoids any implicit dependency on Semgrep AppSec Platform login. First
  # full pass (2026-08-02) found 16 findings; 15 were triaged as false
  # positives from rules that don't understand this codebase's specific
  # patterns (Fastify's typed reply.send() streaming S3 objects/buffers vs.
  # Express's res.write(userInput); sanitize-html-wrapped dangerouslySetInnerHTML;
  # a deliberate negative-test JWT fixture) and suppressed inline with
  # `nosemgrep: <rule-id>` comments explaining why at each site — see
  # docs/audits/security/audit-sast-semgrep-2026-08-02.md for the full triage
  # ledger. One finding (backend/src/modules/confidentiality/
  # confidentiality-pdf.ts) could not be suppressed inline because the exact
  # flagged line sits inside a template literal, where any inline comment
  # becomes literal PDF output text — it is carried forward via
  # --baseline-commit on pull requests instead, so it won't block merges but
  # any genuinely NEW finding will. continue-on-error stays true until a
  # clean run is confirmed in Actions — TODO: flip to false once verified.
  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep==1.172.0

      - name: Scan (PR — baseline against base branch, only new findings block)
        if: github.event_name == 'pull_request'
        continue-on-error: true # TODO: flip to false once a clean run is confirmed in Actions
        run: |
          semgrep --config p/typescript --config p/nodejs --config p/owasp-top-ten \
            --config p/secrets --config p/javascript \
            --baseline-commit "${{ github.event.pull_request.base.sha }}" \
            --error backend/src frontend

      - name: Scan (push — full scan, known baseline findings expected)
        if: github.event_name != 'pull_request'
        continue-on-error: true # TODO: flip to false once a clean run is confirmed in Actions
        run: |
          semgrep --config p/typescript --config p/nodejs --config p/owasp-top-ten \
            --config p/secrets --config p/javascript \
            --error backend/src frontend

  # ── SAST (custom authorization rules) ───────────────────────────────────────
  # S-028 (2026-08-02 audit): 5 repo-specific rules in .semgrep/rules/ target
  # the exact defect class SECURITY_AUDIT2's S-005 flagged — routes that
  # bypass the central medical-access guard, admin routes with no auth hook,
  # clinical reads missing the doctor-scope filter, raw JWT verification used
  # for authorization instead of the DB-backed gates, and unguarded cron/
  # internal endpoints. See docs/audits/security/audit-authz-rules-2026-08-02.md
  # for the full rule design, fixture coverage, and corpus validation.
  #
  # Runs WITHOUT --baseline-commit, unlike sast-semgrep above — known
  # violations are meant to show as findings here, not be silently carried
  # forward, per that report's remediation tracking.
  #
  # Loops per-file rather than passing the whole backend/src/routes/ tree to
  # one semgrep invocation: multi-file batches were empirically found to
  # produce wrong results (both false negatives and false positives) with
  # these specific pattern-not-inside rules in Semgrep 1.172.0, while
  # single-file invocation was reliable in every test — see the audit report.
  # Loading all 5 rules per file (not one invocation per rule per file) keeps
  # this to 138 semgrep calls rather than 690.
  #
  # continue-on-error stays true until a clean run is confirmed in Actions —
  # separately, 3 files currently have confirmed real findings (tracked in
  # the audit report) that this phase's scope was to detect, not fix — TODO:
  # flip to false once those are remediated and a clean run is confirmed.
  sast-authz-rules:
    name: SAST (Custom Authorization Rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep==1.172.0

      - name: Run custom authorization rules (per-file)
        continue-on-error: true # TODO: flip to false once a clean run is confirmed in Actions
        run: |
          set -e
          fail=0
          for f in backend/src/routes/*.route.ts; do
            if ! semgrep --config .semgrep/rules/ --error --quiet "$f"; then
              fail=1
            fi
          done
          exit $fail

  # ── SBOM (CycloneDX) ───────────────────────────────────────────────────────
  # Generates a software bill of materials per workspace and uploads as a
  # build artifact. continue-on-error stays true until a clean run is
  # observed in Actions (can't dry-run this locally against the CI
  # lockfile install) — TODO: flip to false once verified green.
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: "10.33.2"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SBOM (root, frontend, backend)
        continue-on-error: true # TODO: flip to false once a clean run is confirmed in Actions
        run: |
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file sbom-root.json
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file ../sbom-frontend.json frontend/package.json
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file ../sbom-backend.json backend/package.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom-*.json
          if-no-files-found: warn

  # ── Container scan (Trivy) ─────────────────────────────────────────────────
  # S-028 (2026-08-02 audit): frontend/Dockerfile builds on node:22-bookworm-slim.
  # Debian base-layer and npm-bundled-tooling CVEs are invisible to CodeQL,
  # Dependabot, pnpm audit, and OSV-Scanner alike — none of them look inside a
  # built image. Two passes: `config` catches Dockerfile/compose
  # misconfiguration (no Terraform/K8s in this repo, so this is the full IaC
  # surface); `image` scans the actual built artifact. --ignore-unfixed
  # because node:22-bookworm-slim carries ~160 Debian CVEs with no upstream
  # patch yet (verified locally) — failing on those would be permanently red
  # for a risk this repo has no way to remediate. continue-on-error stays
  # true until a clean run is confirmed in Actions (this job's image build
  # step could not be dry-run locally — no container runtime on the audit
  # host, see docs/audits/security/tooling-images-2026-08-02.md) — TODO: flip
  # to false once verified green.
  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Scan Dockerfile + compose config
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true # TODO: flip to false once a clean run is confirmed in Actions
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Build frontend production image
        # Placeholder build-time values — this job only needs a representative
        # image to scan, not a deployable one. Real values are Railway service
        # variables, injected only at actual deploy time.
        run: |
          docker build \
            --build-arg ALLOW_DEGRADED_BUILD=1 \
            --build-arg NEXT_PUBLIC_API_URL=https://placeholder.invalid \
            --build-arg NEXT_PUBLIC_MEDIA_ALLOWED_HOSTS=placeholder.invalid \
            --build-arg NEXT_PUBLIC_SITE_URL=https://placeholder.invalid \
            -t gh-frontend-scan:ci \
            -f frontend/Dockerfile \
            frontend

      - name: Scan built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true # TODO: flip to false once a clean run is confirmed in Actions
        with:
          scan-type: image
          image-ref: gh-frontend-scan:ci
          ignore-unfixed: true
          exit-code: "1"
          severity: "CRITICAL,HIGH"

  # ── Standalone lockfile drift ─────────────────────────────────────────────
  # Railway deploys backend + frontend as standalone packages using their own
  # committed lockfiles (--frozen-lockfile --ignore-workspace). Those child
  # lockfiles are NOT exercised by the workspace install above, so drift
  # between a child package.json and its standalone lockfile would pass CI and
  # fail only at deploy time. This job catches that drift here instead.
  standalone-lockfiles:
    name: Standalone lockfile (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: "10.33.2"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Verify standalone lockfile is in sync
        working-directory: ${{ matrix.package }}
        # Mirrors backend/nixpacks.toml + frontend/Dockerfile exactly.
        # --frozen-lockfile fails if the standalone lockfile doesn't match
        # package.json, catching deploy-time failures in CI.
        run: pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts

      - name: Audit dependencies (standalone — this is what actually deploys)
        working-directory: ${{ matrix.package }}
        # The workspace root pnpm audit only sees the root lockfile. This is
        # the lockfile Railway actually installs from, and it does NOT
        # inherit root-level pnpm.overrides (--ignore-workspace) — it has its
        # own override block in this package's own package.json. Audit it
        # here directly rather than assuming the root check covers it.
        # S-028 (2026-08-02): see the workspace audit step's comment — the
        # registry-error condition this flag guards against is not currently
        # occurring; kept as a defensive no-op. The `sca-osv` job is the
        # authoritative gate for this repo's actual dependency risk.
        run: pnpm audit --audit-level=high --ignore-workspace --ignore-registry-errors
