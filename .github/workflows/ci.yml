name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Typecheck + Lint ─────────────────────────────────────────────────────
  # Fast gate: no DB required. Fails early on type errors or lint warnings
  # before the heavier test jobs start.
  check:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: "10.33.2"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (frontend + backend)
        run: pnpm typecheck

      - name: Lint (frontend + backend)
        run: pnpm lint

      - name: Build (frontend + backend)
        # Catches breakage typecheck alone misses (e.g. an invalid Next.js
        # page export that only fails Next's production build/analyzer, not
        # plain `tsc --noEmit`). Mirrors what Railway actually builds.
        run: pnpm build

      - name: Check pnpm.overrides drift (root vs frontend vs backend)
        # Children deploy standalone (--ignore-workspace) and do NOT inherit the
        # root overrides, so a security pin must be mirrored into every service
        # that resolves the package. See docs/dependency-overrides.md.
        run: node scripts/check-override-drift.mjs

      - name: Audit dependencies (workspace)
        # --ignore-registry-errors: npm retired the audits/quick + audits
        # endpoints (410) without a pnpm-side bulk-endpoint migration yet, so
        # every `pnpm audit` call fails on registry error rather than finding
        # vulnerabilities. Un-skip once pnpm ships bulk-endpoint support.
        run: pnpm audit --audit-level=high --ignore-registry-errors

  # ── Secret scan ──────────────────────────────────────────────────────────
  # Gitleaks scans every push/PR diff for hardcoded secrets (API keys,
  # tokens, credentials). Free for personal-account-owned repos (this repo
  # is owned by the myglobalhealthonline GitHub user, not an org), so no
  # GITLEAKS_LICENSE secret is required — the env var below is a no-op
  # reference kept for forward-compat if the repo ever moves under an org.
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── Backend Tests ─────────────────────────────────────────────────────────
  # Spins up a real Postgres instance so all 14 backend tests run —
  # including the two integration tests (auth audit hook, doctor-services)
  # that self-skip when no DB is reachable.
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gh_test
      # Zod schema requires >= 16 chars for CRON_SECRET.
      CRON_SECRET: ci-cron-placeholder-min-16
      NODE_ENV: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: "10.33.2"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Run backend tests
        run: pnpm --filter backend test

  # ── Frontend Tests ────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: "10.33.2"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm --filter frontend test

  # ── Standalone lockfile drift ─────────────────────────────────────────────
  # Railway deploys backend + frontend as standalone packages using their own
  # committed lockfiles (--frozen-lockfile --ignore-workspace). Those child
  # lockfiles are NOT exercised by the workspace install above, so drift
  # between a child package.json and its standalone lockfile would pass CI and
  # fail only at deploy time. This job catches that drift here instead.
  standalone-lockfiles:
    name: Standalone lockfile (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: "10.33.2"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Verify standalone lockfile is in sync
        working-directory: ${{ matrix.package }}
        # Mirrors backend/nixpacks.toml + frontend/Dockerfile exactly.
        # --frozen-lockfile fails if the standalone lockfile doesn't match
        # package.json, catching deploy-time failures in CI.
        run: pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts

      - name: Audit dependencies (standalone — this is what actually deploys)
        working-directory: ${{ matrix.package }}
        # The workspace root pnpm audit only sees the root lockfile. This is
        # the lockfile Railway actually installs from, and it does NOT
        # inherit root-level pnpm.overrides (--ignore-workspace) — it has its
        # own override block in this package's own package.json. Audit it
        # here directly rather than assuming the root check covers it.
        # --ignore-registry-errors: see the workspace audit step above — npm
        # retired the audit endpoints (410) upstream, unrelated to this repo.
        run: pnpm audit --audit-level=high --ignore-workspace --ignore-registry-errors
