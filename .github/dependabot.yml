version: 2

# NOTE on "separate daily security updates": Dependabot's security-only
# updates (triggered by GitHub Security Advisories, independent of the
# schedule below) are a repo-level toggle — Settings → Code security →
# "Dependabot security updates" — not a dependabot.yml directive. Once
# enabled there, GitHub opens a PR immediately on a new advisory regardless
# of the weekly interval configured here. The version-update config below
# only covers routine (non-emergency) upgrades.
updates:
  # ── npm: root workspace ────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    labels: ["dependencies"]

  # NOTE: there are deliberately NO separate "/frontend" and "/backend" npm
  # entries. Both are pnpm workspace members (pnpm-workspace.yaml), so the
  # root entry above already bumps frontend/package.json and
  # backend/package.json — PRs #79, #80, #81 and #84 each touched all three
  # manifests from the root ecosystem alone.
  #
  # Per-directory entries were configured until 2026-08-20 and could never
  # produce a mergeable PR. Dependabot treats a workspace member as having
  # no lockfile of its own, so those PRs changed a child package.json and
  # nothing else: not the root pnpm-lock.yaml, not the child standalone
  # lockfile. Every job then died at install with ERR_PNPM_OUTDATED_LOCKFILE.
  # Five such PRs were open at once (#73, #74, #75, #77, #83), each a
  # duplicate of a root-ecosystem PR that did the same bump correctly.
  #
  # KNOWN GAP, not solved by this file: Dependabot never updates
  # frontend/pnpm-lock.yaml or backend/pnpm-lock.yaml, which is what Railway
  # actually installs from (--ignore-workspace). A root-ecosystem PR is
  # therefore still incomplete until those two are regenerated by hand —
  # that is what the `standalone-lockfiles` CI job catches. See
  # docs/guides/dependency-overrides.md.

  # ── GitHub Actions ─────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "github-actions"]
