rules:
  - id: gh-cron-route-missing-secret
    languages: [typescript]
    severity: ERROR
    message: >
      This file registers a /api/cron/* or /api/internal/* route — an
      endpoint meant to be triggered only by a scheduler (Railway cron,
      GitHub Actions, etc.), never a browser session — but never calls
      isValidCronSecret (backend/src/utils/cron-auth.ts) anywhere. Without
      it, the endpoint is reachable by anyone who finds the URL. Every such
      route must fail closed if CRON_SECRET is unset (503) and reject any
      request whose x-cron-token/x-cron-secret header doesn't match via
      isValidCronSecret's constant-time comparison.
    metadata:
      category: security
      references:
        - docs/audits/security/audit-authz-rules-2026-08-02.md
    patterns:
      - pattern-either:
          - pattern: $APP.get($PATH, ...)
          - pattern: $APP.post($PATH, ...)
          - pattern: $APP.put($PATH, ...)
          - pattern: $APP.patch($PATH, ...)
          - pattern: $APP.delete($PATH, ...)
      - metavariable-regex:
          metavariable: $PATH
          regex: ^"\/api\/(cron|internal)\/
      - pattern-not-inside: |
          const $ROUTE1: FastifyPluginAsync = async ($APPVAR1) => {
            ...
            <... isValidCronSecret(...) ...>
            ...
          }
