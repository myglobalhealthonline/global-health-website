# Local PostgreSQL for backend API + Prisma (Phase 3.6.2).
# Usage from repo root:
#   docker compose up -d
# Then set backend/.env DATABASE_URL to:
#   postgresql://postgres:postgres@localhost:5432/global_health
# Run: pnpm --filter backend db:migrate && pnpm --filter backend db:seed

services:
  postgres:
    image: postgres:16-alpine
    container_name: global-health-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: global_health
    ports:
      # Loopback-only — a default-credentials Postgres has no business being
      # reachable from other hosts on the network (code review 2026-07-05).
      - "127.0.0.1:5432:5432"
    volumes:
      - global_health_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d global_health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Isolated TEST database (audit plan 0.2) — separate service + port + volume
  # so `pnpm --filter backend test` can never touch dev or live data.
  # Usage: docker compose up -d postgres-test
  # Test DATABASE_URL (satisfies test-guard's "test" db-name rule):
  #   postgresql://postgres:postgres@127.0.0.1:5433/global_health_test
  postgres-test:
    image: postgres:16-alpine
    container_name: global-health-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: global_health_test
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - global_health_pg_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d global_health_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:1.4.6
    container_name: global-health-clamav
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - global_health_clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  global_health_pg:
  global_health_pg_test:
  global_health_clamav:
